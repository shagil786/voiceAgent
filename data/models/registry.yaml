# Candidate GGUF models — the single model registry.
# Consumers: llm.load_model_registry (download/list) and
# config.default_candidate_models (candidate stems).
#
# `models` entries are auto-downloadable (name / url / size_mb / params).
# `local_models` entries are artifacts produced outside any auto-download
# channel (the Kaggle fine-tuning workflow in scripts/kaggle/) — they carry
# a filename only, are listed when present in the models dir, and NEVER
# ship an external URL as a default download source.
models:
