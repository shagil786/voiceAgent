# Example tenant policies — same schema as the platform default
# (data/policies/policies.yaml). Only actions the tenant declares exist;
# everything else is least-privilege DENY.
escalate:
  - fraud

# Sprint A2: business thresholds are POLICY DATA. The amount at/above which a
# refund IS a high_value_refund — previously hardcoded in agent.py, now
# declared here and evaluated through the PolicyEngine (tenant currency
# wired). Undeclared -> the platform default (5000).
high_value_refund_threshold: 5000

order_status:
  allow: true

complaint:
  allow: true
  escalate_when:
    frustrated: true
