# Per-intent exemplars for the default (built-in demo) tenant —
# the file NAME is the intent, the list is the exemplars the
# embedding classifier matches against (same schema as
# data/tenants/example-acme/intents/). NOTE: the non-en exemplars
# are LLM-authored SYNTHETIC phrasings, not transcripts of real
# customers — real-traffic validation is still pending.
# M5c: informational questions about refund timing — NOT refund
# requests. Without these, 'refund kitne din me aata hai?' misroutes
# to high_value_refund -> ESCALATE.
- refund kitne din me aata hai
- when will I get my refund back
- paise kab wapas milenge
- how long does a refund take
- how many days for the refund
- refund kab tak aayega
- mera refund kab milega
- when is my money refunded
