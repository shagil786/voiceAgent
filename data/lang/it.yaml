# Platform language data: Italian. No tts_voice: upstream
# rhasspy/piper-voices ships only it_IT-riccardo-x_low (no medium)
# so Italian falls back with a warning until a medium voice lands.
code: it
detect_stage: global
detect_tokens:
  - che
  - per
  - grazie
  - voglio
  - mio
  - fattura
  - rimborso
  - dove
  - quando
  - ordine
numbers:
  words:
    zero: 0
    uno: 1
    una: 1
    due: 2
    tre: 3
    quattro: 4
    cinque: 5
    sei: 6
    sette: 7
    otto: 8
    nove: 9
    dieci: 10
    undici: 11
    dodici: 12
    tredici: 13
    quattordici: 14
    quindici: 15
    sedici: 16
    diciassette: 17
    diciotto: 18
    diciannove: 19
    venti: 20
    trenta: 30
    quaranta: 40
    cinquanta: 50
    sessanta: 60
    settanta: 70
    ottanta: 80
    novanta: 90
  scales:
    cento: 100
    mille: 1000
    mila: 1000
    milione: 1000000
    milioni: 1000000
    miliardo: 1000000000
    miliardi: 1000000000
  hundred: [cento]
currency_words:
  "€":
    - 'euro'
sentiment:
  - arrabbiato
  - arrabbiata
  - furioso
  - inaccettabile
  - ridicolo
  - truffa
  - basta
  - pessimo
  - assurdo
  - parlare con il responsabile
