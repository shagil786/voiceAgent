# VoiceAgent policy-as-code — edited by the company's support/compliance team.
# A change here is audited (decision log) and validated before deploy
# (scripts/validate_policies.py).

# Actions that always escalate to a human.
escalate:
  - fraud
  - legal
  - chargeback
  - high_value_refund

refund:
  require_auth: true
  max_without_approval: 5000

high_value_refund:
  require_auth: true
  escalate: true

order_status:
  allow: true

# M5c: read-only informational intents — always allow, no auth, no escalation.
refund_info:
  allow: true

delivery_eta:
  allow: true

order_cancellation:
  require_auth: true
  allowed_until: shipped

account_changes:
  require_auth: true
  require_otp: true
  # M6b: injection attempts on this sensitive action go to a human, never a
  # bot round-trip. Signal from the deterministic injection guard
  # (voiceagent.security); the action decision itself is classifier-driven
  # and cannot be hijacked.
  escalate_when:
    injection_suspected: true

billing:
  allow: true

recharge:
  allow: true

payment_declined:
  allow: true

otp:
  require_auth: true

# M6a: complaints are answered by the bot, BUT an already-frustrated
# customer goes straight to a human instead of another bot round-trip.
# `frustrated` is a context signal from the deterministic frustration
# detector (voiceagent.sentiment) — conditions here are data, not code.
complaint:
  allow: true
  escalate_when:
    frustrated: true

# Sprint A: reschedule is a write action on a live delivery — requires the
# customer to be authenticated (order id stated = authenticated), and the
# ToolGateway precondition (status CONFIRMED/SHIPPED) is checked separately.
reschedule_delivery:
  require_auth: true

# Sprint A: cancel is a destructive write on a live order — requires the
# customer to be authenticated; the ToolGateway precondition (status not in
# SHIPPED/DELIVERED) is checked separately by the gateway.
cancel_order:
  require_auth: true
